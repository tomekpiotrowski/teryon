[package]
name = "teryon"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[[bin]]
name = "teryon"
path = "src/main.rs"

[dependencies]
erno = { git = "https://github.com/tomekpiotrowski/erno", tag = "v0.3.0" }
sea-orm = { version = "1.1", features = ["sqlx-postgres", "runtime-tokio", "macros", "with-uuid", "with-chrono", "with-json"] }
sea-orm-migration = { version = "1.1", features = ["sqlx-postgres"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "sync", "fs"] }
async-trait = "0.1"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tracing = "0.1"
nix = { version = "0.29", features = ["signal"] }
similar = "2"

[dev-dependencies]
erno = { git = "https://github.com/tomekpiotrowski/erno", tag = "v0.3.0", features = ["test-utils"] }
lets_expect = { version = "0.5", features = ["tokio"] }
tempfile = "3"
axum-test = "18"
