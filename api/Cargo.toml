[package]
name = "teryon"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[[bin]]
name = "teryon"
path = "src/main.rs"

[dependencies]
erno = { git = "https://github.com/tomekpiotrowski/erno", tag = "v0.2.0" }
sea-orm-migration = { version = "1.1", features = ["sqlx-postgres"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
async-trait = "0.1"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
erno = { git = "https://github.com/tomekpiotrowski/erno", tag = "v0.2.0", features = ["test-utils"] }

