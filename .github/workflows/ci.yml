# Mirrors `erno lint` and `erno test`. A check that only exists here is a
# check nobody can reproduce locally.
#
# The JavaScript packages install with bun and only bun.lock is committed, so
# every node job here has to use bun. Regenerating this file from the Erno
# template reintroduces `npm ci` against a package-lock.json that does not
# exist, which fails at the setup step — check this after an Erno upgrade.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: teryon
          POSTGRES_PASSWORD: teryon
          POSTGRES_DB: teryon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U teryon"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: api
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run build
      - name: Test terminal command setup
        run: bun run ng test --watch=false --include='src/app/service/terminal-command.spec.ts'
      # The remaining app unit tests are omitted here. Ionic 9's published ESM uses extensionless
      # relative imports (`./navigation/back-button`) that Vitest/jsdom cannot
      # resolve. Do not add `bun run test:ci` here until `erno test --app` is
      # green locally.

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run test

  www:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: www
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build

  local:
    # The core library and the local service run on every developer machine,
    # so they are built and tested on all three systems. The tests that start
    # the fake agents need a shell script to run, which Windows cannot start
    # directly, so Windows runs the unit tests only.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy -p teryon-core -p teryon --all-targets -- -D warnings
      - name: Test
        if: runner.os != 'Windows'
        run: cargo test -p teryon-core -p teryon
      - name: Unit tests
        if: runner.os == 'Windows'
        run: cargo test -p teryon-core -p teryon --lib

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
      - name: Install the libraries Tauri needs
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Build the app
        working-directory: app
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Build teryon and place it for the bundle
        run: |
          cargo build -p teryon
          cd app && node ../desktop/scripts/copy-teryon.mjs debug
      - name: Clippy
        run: cargo clippy -p teryon-desktop --all-targets --features tauri/custom-protocol -- -D warnings
      - name: Test command installation
        run: cargo test -p teryon-desktop --lib

  e2e:
    # Every test starts a `teryon service` of its own; nothing else is needed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
      - name: Install app
        working-directory: app
        run: bun install --frozen-lockfile
      - name: Install e2e
        working-directory: e2e
        run: bun install --frozen-lockfile
      - name: Install Playwright
        working-directory: e2e
        run: bunx playwright install --with-deps chromium
      - name: Build teryon
        run: cargo build -p teryon
      - name: Playwright
        working-directory: e2e
        env:
          CI: true
        run: bunx playwright test
