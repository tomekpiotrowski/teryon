<header class="top-bar">
  <button class="top-icon" type="button" aria-label="Open menu" aria-keyshortcuts="/ Control+K" (click)="menuOpened.emit()">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4h12M2 8h12M2 12h12"></path></svg>
  </button>
  <button class="top-mark" type="button" aria-label="Home" (click)="homeOpened.emit()">TERYON</button>
  <span class="top-scope">{{ scope }}</span>
  <span class="top-spacer"></span>
  @if (leader) { <span class="top-leader" role="status">{{ leader.toUpperCase() }} …</span> }
  @if (running) {
    <span class="top-count top-running"><span class="top-dot top-pulse"></span>{{ running }} running</span>
  }
  @if (waiting) {
    <button class="top-count top-waiting" type="button" [attr.aria-label]="waiting + ' need you'" (click)="homeOpened.emit()"><span class="top-dot"></span>{{ waiting }}</button>
  }
  <button class="top-icon" type="button" aria-label="Settings" aria-keyshortcuts="s" (click)="settingsOpened.emit()">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4h7M12 4h2M2 12h2M7 12h7"></path><circle cx="10.5" cy="4" r="1.5"></circle><circle cx="5.5" cy="12" r="1.5"></circle></svg>
  </button>
</header>
