<ion-content class="auth-content" [fullscreen]="true">
  <div class="auth-theme segmented" aria-label="Color theme">
    <button type="button" [class.active]="theme.theme() === 'light'" (click)="theme.set('light')">Light</button>
    <button type="button" [class.active]="theme.theme() === 'dark'" (click)="theme.set('dark')">Dark</button>
  </div>

  <main class="auth-shell">
    <div class="auth-panel">
      <div class="brand">TERYON</div>

      <div class="auth-column">
        <h1 class="auth-title">New password</h1>

        <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">
          <input class="auth-field" type="password" formControlName="password" autocomplete="new-password"
                 placeholder="At least 8 characters" aria-label="New password">
          <input class="auth-field" type="password" formControlName="confirm" autocomplete="new-password"
                 placeholder="Repeat password" aria-label="Repeat password">

          @if (mismatch()) {
            <p class="form-error" role="alert">Passwords do not match.</p>
          }
          @if (error()) {
            <p class="form-error" role="alert">{{ error() }}</p>
          }

          <div class="auth-actions">
            <button type="submit" [class.ready]="ready()" [disabled]="loading()">
              @if (loading()) {
                Saving…
              } @else {
                Set new password<span class="enter-hint">↵</span>
              }
            </button>
          </div>
        </form>
      </div>
    </div>
  </main>
</ion-content>
